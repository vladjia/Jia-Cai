<style>
  @font-face{font-family:'FF';src:url('FF-caps.woff2') format('woff2');
    unicode-range:U+0041-005A;font-display:swap}
  @font-face{font-family:'FF';src:url('FF-body.woff2') format('woff2');
    unicode-range:U+0020-0023,U+0025-0040,U+005B-007E;font-display:swap}

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{background:#080B12;color:#E6E2D6;
    font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif}

  #frame{position:fixed;left:0;right:0;bottom:0;border:0;display:block;
    top:env(safe-area-inset-top,0px);
    height:calc(100% - env(safe-area-inset-top,0px));
    background:#080B12}

  #veil{position:fixed;inset:0;z-index:10;
    display:flex;align-items:center;justify-content:center;
    background:#080B12;transition:opacity .45s ease}
  #veil.hide{opacity:0;pointer-events:none}
  #veil::before{content:'';position:absolute;inset:0;
    background:radial-gradient(ellipse 70% 45% at 50% 30%,rgba(121,214,236,.11),transparent 70%),
               radial-gradient(ellipse 90% 50% at 50% 100%,rgba(217,186,107,.07),transparent 70%)}

  #motes{position:absolute;inset:0;overflow:hidden;pointer-events:none}
  .m{position:absolute;bottom:-30px;border-radius:50%;opacity:0;
    animation:drift linear infinite}
  @keyframes drift{
    0%{transform:translate(0,0) scale(.5);opacity:0}
    10%{opacity:.85} 50%{transform:translate(18px,-46vh) scale(1)}
    90%{opacity:.5} 100%{transform:translate(-14px,-102vh) scale(.6);opacity:0}}

  .box{position:relative;text-align:center;padding:0 30px}
  .crest{width:96px;height:96px;margin:0 auto 26px;position:relative;
    animation:breathe 3.2s ease-in-out infinite}
  .crest img{width:100%;height:100%;border-radius:14px;
    box-shadow:0 0 34px rgba(217,186,107,.35)}
  @keyframes breathe{0%,100%{transform:scale(1);filter:brightness(1)}
                     50%{transform:scale(1.04);filter:brightness(1.15)}}

  .en{font-family:'FF',serif;font-size:16px;letter-spacing:7px;color:#B99A50}
  .cn{font-family:'FF',serif;font-size:52px;color:#F3DFA3;letter-spacing:4px;
    margin-top:8px;line-height:1.05;-webkit-font-smoothing:antialiased;
    text-shadow:0 0 26px rgba(217,186,107,.5)}
  .zh{font-size:19px;letter-spacing:5px;color:#E6E2D6;margin-top:8px;font-weight:500}

  .bar{width:190px;height:2px;margin:34px auto 0;background:#1C2334;
    overflow:hidden;position:relative}
  .bar i{position:absolute;inset:0;width:38%;
    background:linear-gradient(90deg,transparent,#F3DFA3,transparent);
    animation:sweep 1.5s ease-in-out infinite}
  @keyframes sweep{0%{transform:translateX(-120%)}100%{transform:translateX(370%)}}

  .st{margin-top:16px;font-size:13px;color:#7E7A6C;font-weight:600;letter-spacing:1px}
  .go{display:none;margin:24px auto 0;padding:15px 42px;cursor:pointer;
    background:linear-gradient(180deg,#2A3450,#141C2C);color:#F3DFA3;
    border:1px solid #6E5C2E;font-family:'FF',serif;font-size:22px;font-weight:400;
    letter-spacing:8px;text-indent:8px;-webkit-font-smoothing:antialiased}
  .go:hover{border-color:#D9BA6B;box-shadow:0 0 16px rgba(217,186,107,.35)}

  #pin{display:none;margin-top:26px}
  #pin input{width:180px;padding:13px;text-align:center;letter-spacing:10px;
    font-size:22px;background:#0E1420;border:1px solid #2A3450;color:#F3DFA3;
    border-radius:6px;outline:none}
  #pin input:focus{border-color:#D9BA6B}
  #pinMsg{margin-top:12px;font-size:12px;color:#C24A6D;min-height:16px}
</style>
</head>
<body>
<iframe id="frame" title="家計簿"
        referrerpolicy="no-referrer-when-downgrade"
        allow="clipboard-write"></iframe>

<div id="veil">
<div id="motes"></div>

<div class="box">
  <div class="crest"><img src="icon-512.png" alt=""></div>
  <div class="en">HOUSEHOLD LEDGER</div>
  <div class="cn">FAMILIA</div>
  <div class="zh">家 計 簿</div>
  <div class="bar"><i></i></div>
  <div class="st" id="st">連線中…</div>
  <button class="go" id="go">RETRY</button>
  <div id="pin">
    <input id="pinIn" type="tel" maxlength="4" inputmode="numeric" placeholder="○○○○">
    <div id="pinMsg"></div>
  </div>
</div>
</div>

<script>
/* ══ 把這條換成你的 GAS 網頁應用程式網址 ══ */
var APP = 'https://script.google.com/macros/s/AKfycby4EFTw-rAUK0T4yZLPm-Y0qEIhdMYnOaX1Htk1_NlrKan3UdW08QgJfRpfOGtDvEFOHg/exec';

/* 光點 */
(function(){
  var c = ['rgba(121,214,236,.9)','rgba(217,186,107,.9)','rgba(200,230,255,.7)'], h = '';
  for (var i = 0; i < 20; i++) {
    var s = 1.5 + Math.random() * 3.5;
    h += '<span class="m" style="left:' + (Math.random()*100).toFixed(1) + '%;' +
      'width:' + s.toFixed(1) + 'px;height:' + s.toFixed(1) + 'px;background:' + c[i%3] +
      ';box-shadow:0 0 ' + (5+s*2).toFixed(0) + 'px ' + c[i%3] +
      ';animation-duration:' + (16+Math.random()*20).toFixed(1) + 's;' +
      'animation-delay:-' + (Math.random()*30).toFixed(1) + 's;"></span>';
  }
  document.getElementById('motes').innerHTML = h;
})();

/* Service Worker（坑C：一定要 update） */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js')
    .then(function(reg){ reg.update(); })
    .catch(function(){});
}

var frame = document.getElementById('frame');
var veil  = document.getElementById('veil');
var st    = document.getElementById('st');
var go    = document.getElementById('go');
var bar   = document.querySelector('.bar');
var watchdog = null;

function load(){
  veil.classList.remove('hide');
  bar.style.display = '';
  go.style.display  = 'none';
  st.textContent    = '連線中…';
  clearTimeout(watchdog);
  watchdog = setTimeout(function(){
    st.textContent   = '連線逾時，請按 RETRY';
    bar.style.display = 'none';
    go.style.display  = 'block';
  }, 12000);

  /* 外層參數原封不動帶進 iframe，再加上身分 token */
  var qs = location.search.replace(/^\?/, '');
  var tk = localStorage.getItem('FAM_TK') || '';
  if (tk) qs += (qs ? '&' : '') + 'tk=' + encodeURIComponent(tk);
  frame.src = APP + (qs ? (APP.indexOf('?') >= 0 ? '&' : '?') + qs : '');
}

frame.addEventListener('load', function(){
  /* about:blank 也會觸發 load，要擋掉，不然 PIN 畫面會被掀走 */
  if (!frame.src || frame.src === 'about:blank') return;
  clearTimeout(watchdog);
  setTimeout(function(){ veil.classList.add('hide'); }, 400);
});
go.addEventListener('click', load);

/* 內層喊換頁 / 登出 */
window.addEventListener('message', function(ev){
  var o = ev.origin || '';
  if (!/\.googleusercontent\.com$/.test(o) && o !== 'https://script.google.com') return;
  var d = ev.data;
  if (!d) return;

  if (d.t === 'famnav') {
    var p = String(d.page || '');
    history.replaceState(null, '', p ? ('?page=' + encodeURIComponent(p)) : location.pathname);
    load();
  }
  if (d.t === 'famlogout') {
    localStorage.removeItem('FAM_TK');
    frame.src = 'about:blank';
    location.reload();
  }
});

/* ── PIN 登入 ──────────────────────────── */
var pinBox = document.getElementById('pin');
var pinIn  = document.getElementById('pinIn');
var pinMsg = document.getElementById('pinMsg');

function askPin(){
  bar.style.display = 'none';
  go.style.display  = 'none';
  st.textContent    = '請輸入 PIN';
  pinBox.style.display = 'block';
  setTimeout(function(){ pinIn.focus(); }, 300);
}

pinIn.addEventListener('input', function(){
  pinMsg.textContent = '';
  if (pinIn.value.length !== 4) return;

  pinMsg.textContent = '驗證中…';
  fetch(APP + '?fn=login&pin=' + encodeURIComponent(pinIn.value))
    .then(function(r){ return r.json(); })
    .then(function(j){
      if (!j.ok) { pinMsg.textContent = 'PIN 不對'; pinIn.value = ''; return; }
      localStorage.setItem('FAM_TK', j.tk);
      pinBox.style.display = 'none';
      load();
    })
    .catch(function(){ pinMsg.textContent = '連線失敗，再試一次'; pinIn.value = ''; });
});

if (APP.indexOf('你的部署ID') >= 0) {
  st.textContent = '⚠️ index.html 裡的 APP 網址還沒填';
  bar.style.display = 'none';
} else if (!navigator.onLine) {
  st.textContent = '目前離線，連上網路再試';
  bar.style.display = 'none';
  go.style.display  = 'block';
} else if (!localStorage.getItem('FAM_TK')) {
  askPin();
} else {
  load();
}
</script>
</body>
</html>
